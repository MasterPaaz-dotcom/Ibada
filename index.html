async function migrate(){

  const ids=g.members||[],lead=g.leader===myid,len=g.len||14,now=new Date(ymd(new Date())+"T00:00:00"),st=g.start?new Date(g.start+"T00:00:00"):null;
  let h=`<div class="card"><b>${esc(g.name)}</b><div class="mut">${t("code")}: ${esc(g.id)} · ${ids.length}/30 · ${t("leader")}: ${esc(nm(g.leader))}</div><button class="undo" data-gsh>${t("shLink")}</button></div>`;
  if(!st)h+=`<div class="card">${t("setStart")}</div>`;
  else{
    const r=Math.floor((now-st)/(len*864e5));
    if(r<0)h+=`<div class="card">${t("firstStarts",fmt(st))}</div>`;
    else{
      const s=addDays(st,r*len),e=addDays(s,len-1),days=Math.round((e-now)/864e5)+1;
      if(g.rr<r&&!ru[g.id+r]){ru[g.id+r]=1;updateDoc(doc(db,"groups",g.id),{rs:ids,rr:r})}
      const done=Array.from({length:30},(_,i)=>(J[key(g.id,r,i+1)]||{}).done).filter(Boolean).length;
      h+=`<div class="card"><b>${t("round",r+1)}</b> · ${fmt(s)} – ${fmt(e)}<div class="mut">${t("left",days,done)}</div></div>`;
      if(g.style==="pick")h+=pick(g,r);
      else{
        const R=g.rr===r?g.rs:ids,a=assign(R,r,g.style);
        if(ids.includes(myid)&&!R.includes(myid))h+=`<div class="card mut">${t("waitN")}</div>`;
        h+=R.map((id,i)=>{const own=id===myid,rng=a[i],js=Array.from({length:Math.max(0,rng[1]-rng[0]+1)},(_,k)=>rng[0]+k);
          const chips=js.map(j=>{const k=key(g.id,r,j),x=J[k]||{},can=own||x.helper===myid;return `<button class="chip${x.done?" on":""}${x.helper?" help":""}" data-j="${k}"${can?"":" disabled"}>${j}</button>`}).join("");
          const hl=js.filter(j=>(J[key(g.id,r,j)]||{}).helper).map(j=>{const k=key(g.id,r,j),x=J[k];return `<div class="mut">🤝 ${x.helper===myid?t("helpMe",j,nm(id)):t("helpLine",j,nm(x.helper))}${own&&!x.done?` <button class="sm" data-hc="${k}">${t("helpCancel")}</button>`:""}</div>`}).join("");
          const todo=js.filter(j=>!(J[key(g.id,r,j)]||{}).done);
          const panel=own&&todo.length&&R.length>1?`<div class="mut" style="margin-top:10px">${t("helpQ")}</div><div class="row"><select id="hj">${todo.map(j=>`<option value="${j}">${t("juzW")} ${j}</option>`).join("")}</select><select id="hh">${R.filter(x=>x!==myid).map(x=>`<option value="${x}">${esc(nm(x))}</option>`).join("")}</select><button class="sm" data-hs="${r}">${t("ask")}</button></div>`:"";
          return `<div class="card${own?" hi":""}"><b>${esc(nm(id))}</b> <span class="mut">${t("juzW")} ${rng[0]>rng[1]?"-":rng[0]==rng[1]?rng[0]:rng[0]+" – "+rng[1]}</span><div class="chips">${chips}</div>${hl}${panel}</div>`}).join("");
      }
    }
  }
  return h+(lead?leader(g):ids.includes(myid)?`<button class="undo" data-lv>${t("lv")}</button>`:"");
}
function pick(g,r){
  const own={};
  const chips=Array.from({length:30},(_,i)=>{const j=i+1,k=key(g.id,r,j),x=J[k]||{};if(x.owner)(own[x.owner]=own[x.owner]||[]).push(j);return `<button class="chip${x.done?" on":""}${x.owner&&!x.done?" help":""}" data-pk="${k}"${x.owner&&x.owner!==myid?" disabled":""}>${j}</button>`}).join("");
  return `<div class="card"><div class="mut">${t("pickN")}</div><div class="chips">${chips}</div></div>`+Object.keys(own).map(id=>`<div class="mut">${esc(nm(id))}: ${own[id].join(", ")}</div>`).join("");
}
function leader(g){
  const ids=g.members||[],len=g.len||14,free=Object.values(U).filter(u=>!ids.includes(u.id)).sort((a,b)=>dn(a).localeCompare(dn(b)));
  return `<h3>${t("leader")}</h3><div class="card"><div class="mut">${t("len")}</div><div class="row">${[7,14,30].map(n=>`<button class="chip${len==n?" on":""}" data-len="${n}">${n}</button>`).join("")}<input id="gl" type="number" inputmode="numeric" value="${len}" style="width:90px"></div>
  <div class="mut">${t("style")}</div><select id="gs">${["eq","ord","pick"].map(s=>`<option value="${s}"${(g.style||"eq")===s?" selected":""}>${t("s_"+s)}</option>`).join("")}</select>
  <div class="mut">${t("startD")}</div><input type="date" id="gst" value="${g.start||""}"></div>
  <h3>${t("mem")} (${ids.length}/30)</h3>`+ids.map((id,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${esc(nm(id))}${id===g.leader?" ⭐":""}</span><span><button class="sm" data-gu="${i}">▲</button><button class="sm" data-gd="${i}">▼</button>${id!==g.leader?`<button class="sm" data-gr="${i}">✕</button>`:""}</span></div>`).join("")
  +`<div class="row"><select id="ga">${free.map(u=>`<option value="${u.id}">${esc(dn(u))}</option>`).join("")}</select><button class="sm" data-gad>${t("add")}</button></div>`;
}

function members(){
  const m0=me(),adm=S.admin;
  return `<h3>${t("prof")}</h3><div class="card"><div class="mut">${t("nameHint")}</div><input id="pn" value="${esc(m0.name)}" placeholder="${t("name")}"><div class="mut">${t("nickLbl")}</div><input id="pk" value="${esc(m0.nick||"")}" placeholder="${t("nickPh")}">${m0.anick?`<div class="mut">${t("gaveNick",esc(m0.anick))}</div>`:`<div class="mut">${t("nickNote")}</div>`}<button class="go" data-prof>${t("save")}</button></div>`
  +(!adm?`<div class="card">${t("noAdmin")}<button class="go" data-claim>${t("iAdmin")}</button></div>`:"");
}
function chsTab(){
  return `<h3>${t("chH")}</h3><p class="mut">${t("chNote")}</p>`+CH().map((c,i)=>`<div class="card"><b>${esc(c.name)}</b> <span class="mut">${c.off?t("hidden"):""}</span><div class="mut">${t("goalLbl")}</div><input type="number" min="1" inputmode="numeric" data-tg="${i}" value="${c.target||1000}"><button class="sm" data-cr="${i}">${t("rename")}</button><button class="sm" data-ch="${i}">${c.off?t("show"):t("hide")}</button></div>`).join("")
  +`<h3>${t("addH")}</h3><div class="card"><input id="cn" placeholder="${t("chName")}"><input id="ca" placeholder="${t("chAr")}"><input id="cg" type="number" inputmode="numeric" placeholder="${t("goalLbl")} (1000)"><button class="go" data-ca>${t("add")}</button></div>`;
}

const DU=["2:201","2:286","3:8","3:16","3:147","7:23","14:40","17:24","20:25","20:114","21:87","23:118","25:74","59:10"];
let R={day:"",h:null,d:null};
async function jget(us){for(const u of us){try{const x=await fetch(u);if(x.ok)return await x.json()}catch(e){}}return null}
function loadRem(){
  const day=dayKey();if(R.day===day)return;R={day,h:"load",d:"load"};
  const k=Math.floor(Date.UTC(...day.split("-").map((v,i)=>i==1?+v-1:+v))/864e5),n=k%42+1,ref=DU[k%DU.length];
  const B="https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/",one=j=>j&&(j.hadiths?.[0]||j.hadith?.[0]||j);
  const g=e=>jget([B+e+"/"+n+".min.json",B+e+"/"+n+".json","https://raw.githubusercontent.com/fawazahmed0/hadith-api/1/editions/"+e+"/"+n+".min.json"]).then(one);
  Promise.all([g("eng-nawawi"),g("ara-nawawi")]).then(([en,ar])=>{R.h=en&&en.text?{en:en.text,ar:(ar&&ar.text)||"",src:"Arba‘een an-Nawawi, Hadith "+(en.hadithnumber||n)+(en.grades&&en.grades[0]?" · "+en.grades[0].grade:"")}:"err";draw()});
  jget(["https://api.alquran.cloud/v1/ayah/"+ref+"/editions/quran-uthmani,en.sahih"]).then(j=>{const a=j&&j.data;R.d=a&&a[1]&&a[1].text?{ar:a[0].text,en:a[1].text,src:"Qur’an "+a[1].surah.number+":"+a[1].numberInSurah+" ("+a[1].surah.englishName+"), Sahih International"}:"err";draw()});
}
function rem(){
  loadRem();
  const card=(h,o,k)=>`<h3>${h}</h3><div class="card">${o==="load"?`<p class="mut">${t("loading")}</p>`:!o||o==="err"?`<p class="mut">${t("loadFail")}</p><button class="undo" data-rt>${t("retry")}</button>`:`<div class="ar2">${esc(o.ar)}</div><div class="clamp">${esc(o.en)}</div><div class="mut">${esc(o.src)}</div><button class="undo" data-sh="${k}">${t("send")}</button>`}</div>`;
  return card(t("hadithT"),R.h,"h")+card(t("duaT"),R.d,"d")+`<p class="mut">${t("srcNote")}</p>`;
}
function login(){
  return `<div class="card"><button class="lg" data-lang style="float:right">${lang==="sw"?"EN":"SW"}</button><h3>${t("welcome")}</h3><p class="mut">${t("loginHint")}</p>
  <input id="nm" placeholder="${t("name")}"><input id="wa" inputmode="tel" placeholder="${t("waPh")}"><div class="err">${err}</div><button class="go" data-join>${t("enter")}</button></div>`;
}
function render(){
  if(!r1||!r2){$app.innerHTML=`<p class="mut">${t("loading")}</p>`;return}
  if(!me()){$app.innerHTML=login();return}
  const adm=S.admin,canM=!adm||adm===myid,cs=act();
  if(!["tot","rem","juz","mem","chs"].includes(tab)&&!cs.find(c=>c.id===tab))tab=cs[0]?cs[0].id:"tot";
  const tabs=[...cs.map(c=>[c.id,c.name]),["tot",t("tot")],["rem",t("rem")],["juz",t("juz")],["mem",t("mem")],...(canM?[["chs",t("chs")]]:[])];
  const cur=cs.find(c=>c.id===tab);
  const body=cur?chal(cur):tab==="tot"?totals():tab==="rem"?rem():tab==="juz"?juz():tab==="chs"?chsTab():members();
  $app.innerHTML=`<header><b>${t("app")}</b><span>${esc(dn(me()))} · <a href="#" data-out style="color:var(--tq)">${t("out")}</a><button class="lg" data-lang>${lang==="sw"?"EN":"SW"}</button></span></header><nav>${tabs.map(x=>`<button data-tab="${esc(x[0])}" class="${tab===x[0]?"on":""}">${esc(x[1])}</button>`).join("")}</nav>${body}`;
}

const GD=()=>doc(db,"groups",gsel),V=id=>document.getElementById(id);
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-t],[data-u],[data-tab],[data-join],[data-out],[data-j],[data-share],[data-prof],[data-claim],[data-sh],[data-rt],[data-lang],[data-cr],[data-ch],[data-ca],[data-add],[data-addc],[data-hs],[data-hc],[data-g],[data-mk],[data-jn],[data-lv],[data-gsh],[data-len],[data-gu],[data-gd],[data-gr],[data-gad],[data-pk]");if(!b)return;
  const d=b.dataset;
  if(d.t){P[d.t]=(P[d.t]||0)+1;render();clearTimeout(timer[d.t]);timer[d.t]=setTimeout(()=>flush(d.t),700)}
  else if(d.u){if(cnt(dayKey(),d.u,myid)>0){P[d.u]=(P[d.u]||0)-1;render();clearTimeout(timer[d.u]);timer[d.u]=setTimeout(()=>flush(d.u),700)}}
  else if(d.j){setDoc(doc(db,"juz",d.j),{g:gsel,done:!(J[d.j]||{}).done},{merge:true})}
  else if(d.pk){const x=J[d.pk]||{},rf=doc(db,"juz",d.pk);if(!x.owner)setDoc(rf,{g:gsel,owner:myid,done:false},{merge:true});else if(x.owner===myid)setDoc(rf,x.done?{owner:"",done:false}:{done:true},{merge:true})}
  else if(d.add!==undefined){const [k,n]=d.add.split("|");addCount(k,+n)}
  else if(d.addc!==undefined){const n=Math.round(+V("ci-"+d.addc).value);if(!n)return;addCount(d.addc,n)}
  else if(d.hs!==undefined){const j=V("hj"),h=V("hh");if(!j||!h||!j.value||!h.value)return;setDoc(doc(db,"juz",key(gsel,+d.hs,j.value)),{g:gsel,helper:h.value},{merge:true})}
  else if(d.hc!==undefined){setDoc(doc(db,"juz",d.hc),{helper:""},{merge:true})}
  else if(d.g!==undefined){gsel=d.g;render()}
  else if(d.mk!==undefined){const n=V("gn").value.trim();if(!n)return;const id=Math.random().toString(36).slice(2,7);setDoc(doc(db,"groups",id),{name:n,code:id,leader:myid,len:14,style:"eq",start:ymd(new Date()),members:[myid],rs:[],rr:-1});gsel=id;render()}
  else if(d.jn!==undefined){joinCode(V("gc").value)}
  else if(d.lv!==undefined){if(confirm(t("lvQ")))updateDoc(GD(),{members:arrayRemove(myid)})}
  else if(d.gsh!==undefined){const g=G.find(x=>x.id===gsel);if(g)waShare(t("shMsg",g.name,location.origin+location.pathname+"?g="+g.id))}
  else if(d.len!==undefined){updateDoc(GD(),{len:+d.len})}
  else if(d.gad!==undefined){const g=G.find(x=>x.id===gsel),a=V("ga");if(g&&a&&a.value&&g.members.length<30)updateDoc(GD(),{members:arrayUnion(a.value)})}
  else if(d.gu!==undefined||d.gd!==undefined||d.gr!==undefined){
    const g=G.find(x=>x.id===gsel);if(!g)return;const a=[...g.members],i=+(d.gu??d.gd??d.gr);
    if(d.gu!==undefined&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];
    else if(d.gd!==undefined&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];
    else if(d.gr!==undefined){if(!confirm(t("rmQ",nm(a[i]))))return;a.splice(i,1)}
    updateDoc(GD(),{members:a})}
  else if(d.share!==undefined){share()}
  else if(d.lang!==undefined){lang=lang==="sw"?"en":"sw";localStorage.setItem("lang",lang);render()}
  else if(d.cr!==undefined){const i=+d.cr,v=prompt(t("renameP"),CH()[i].name);if(v&&v.trim())chEdit(i,{name:v.trim()})}
  else if(d.ch!==undefined){const i=+d.ch;chEdit(i,{off:!CH()[i].off})}
  else if(d.ca!==undefined){const n=V("cn").value.trim(),ar=V("ca").value.trim(),tg=Math.max(1,+V("cg").value||1000);if(!n)return;S.ch=[...CH(),{id:"c"+Date.now().toString(36),name:n,ar,target:tg}];save();render()}
  else if(d.prof!==undefined){const n=V("pn").value.trim(),k=V("pk").value.trim();if(!n)return;setDoc(doc(db,"users",me().wa),{name:n,nick:k},{merge:true})}
  else if(d.rt!==undefined){R.day="";render()}
  else if(d.sh){const o=R[d.sh];if(o&&o.en)waShare((d.sh==="h"?t("hadithShare"):t("duaShare"))+"\n\n"+(o.ar||"")+"\n\n"+o.en+"\n\n— "+o.src+"\n\n"+t("app")+" 🌙")}
  else if(d.claim!==undefined){S.admin=myid;save();render()}
  else if(d.tab){tab=d.tab;render()}
  else if(d.out!==undefined){e.preventDefault();localStorage.removeItem("me");myid=null;gu&&gu();gu=null;G=[];render()}
  else if(d.join!==undefined){
    const n=V("nm").value.trim(),wa=V("wa").value.replace(/\D/g,"").slice(-9);
    if(!n||wa.length<9){err=t("badLogin");render();err="";return}
    doJoin(n,wa);
  }
});
$app.addEventListener("change",e=>{
  const i=e.target.id;
  if(i==="gst")updateDoc(GD(),{start:e.target.value});
  else if(i==="gs")updateDoc(GD(),{style:e.target.value});
  else if(i==="gl")updateDoc(GD(),{len:Math.max(1,Math.round(+e.target.value)||14)});
  else if(e.target.dataset.tg!==undefined)chEdit(+e.target.dataset.tg,{target:Math.max(1,+e.target.value||1000)});
});
</script></body></html>

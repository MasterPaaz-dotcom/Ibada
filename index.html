let lang=localStorage.getItem("lang")==="en"?"en":"sw";
const t=(k,...a)=>{const v=(X[lang]||X.sw)[k];return typeof v==="function"?v(...a):v};

const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
// A "day" runs from 11 pm to 11 pm, so the new day (and winner) starts at 23:00
const dayKey=(d=new Date())=>ymd(new Date(d.getTime()+36e5));
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);

// Opens the regular WhatsApp (not WhatsApp Business) on Android; wa.me elsewhere
function waShare(text){
  const e=encodeURIComponent(text),web="https://wa.me/?text="+e;
  if(/Android/i.test(navigator.userAgent))location.href="intent://send?text="+e+"#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url="+encodeURIComponent(web)+";end";
  else window.open(web,"_blank");
}

const db=getFirestore(initializeApp(CFG));
let S={members:[],start:"",admin:"",ch:[]},C={},D={},H={},P={},G={},O={},gsel="",ready=false,tab="",myid=localStorage.getItem("me"),timer={},err="";
const M=()=>S.members;
const CH=()=>S.ch&&S.ch.length?S.ch:DCH;
const act=()=>CH().filter(c=>!c.off);
const me=()=>M().find(m=>m.id===myid);
const dn=m=>m.anick||m.nick||m.name;
const cnt=(day,k,id)=>(C[day+"|"+k+"|"+id]||0)+(day===dayKey()&&id===myid?P[k]||0:0);
const save=()=>setDoc(doc(db,"settings","main"),{members:S.members,start:S.start||"",admin:S.admin||"",ch:S.ch||[]},{merge:true});
const chEdit=(i,o)=>{S.ch=CH().map((c,j)=>j===i?{...c,...o}:c);save();render()};
const write=(k,n)=>setDoc(doc(db,"counts",dayKey()+"_"+k+"_"+myid),{day:dayKey(),type:k,mid:myid,n:increment(n)},{merge:true});
const flush=k=>{const n=P[k];if(!n)return;P[k]=0;write(k,n)};
function addCount(k,n){const key=dayKey()+"|"+k+"|"+myid,cur=cnt(dayKey(),k,myid);n=Math.max(n,-cur);if(!n)return;C[key]=(C[key]||0)+n;write(k,n);render()}

onSnapshot(doc(db,"settings","main"),d=>{const x=d.exists()?d.data():{};S={members:x.members||[],start:x.start||"",admin:x.admin||"",ch:x.ch||[],gok:x.gok||[],greq:x.greq||[]};ready=true;draw()});
onSnapshot(collection(db,"counts"),sn=>{C={};sn.forEach(d=>{const x=d.data();C[x.day+"|"+x.type+"|"+x.mid]=x.n||0});draw()});
onSnapshot(collection(db,"juz"),sn=>{D={};H={};O={};sn.forEach(d=>{const x=d.data();D[d.id]=!!x.done;H[d.id]=x.helper||"";O[d.id]=x.owner||""});draw()});
onSnapshot(collection(db,"groups"),sn=>{G={};sn.forEach(d=>{const x=d.data();G[d.id]={...x,members:x.members||[],pending:x.pending||[]}});draw()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)Object.keys(P).forEach(flush)});
setInterval(()=>draw(),60000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

function draw(){if(document.activeElement&&["INPUT","SELECT"].includes(document.activeElement.tagName))return;render()}
function left(){const n=new Date(),e=new Date(n);e.setHours(23,0,0,0);if(e<=n)e.setDate(e.getDate()+1);const m=Math.floor((e-n)/6e4);return Math.floor(m/60)+"h "+m%60+"m"}
function ranked(day,k){return M().map(m=>({m,n:cnt(day,k,m.id)})).sort((a,b)=>b.n-a.n)}
function board(day,c){const tg=c.target||1000;return ranked(day,c.id).map((r,i)=>`<div class="row${r.m.id===myid?" me":""}"><span class="rk">${i==0&&r.n>0?"👑":i+1}</span><div class="bar"><i style="width:${Math.min(100,r.n/tg*100)}%"></i><b>${esc(dn(r.m))}</b></div><span class="n">${r.n}${r.n>=tg?" ✅":""}</span></div>`).join("")}

function chal(c){
  const d=dayKey(),y=dayKey(new Date(Date.now()-864e5)),w=ranked(y,c.id)[0];
  return `<div class="card hero">${c.ar?`<div class="ar">${esc(c.ar)}</div>`:`<h3>${esc(c.name)}</h3>`}<div class="big">${cnt(d,c.id,myid)}</div>
  <div class="sub">${t("goal",c.target||1000)} · ${t("endsAt",left())}</div>
  <button class="tap" data-t="${c.id}">+1</button><button class="undo" data-u="${c.id}">−1</button><div class="chips" style="justify-content:center;margin-top:14px">${[50,100,150,200].map(n=>`<button class="chip" style="width:auto;padding:0 16px;border-radius:22px" data-add="${c.id}|${n}">+${n}</button>`).join("")}</div><div class="row" style="margin-top:10px"><input id="ci-${c.id}" type="number" inputmode="numeric" placeholder="${t("custom")}"><button class="sm" data-addc="${c.id}">${t("addBtn")}</button></div></div>
  <div class="card win">${w&&w.n>0?`🏆 ${t("winPrev")}: <b>${esc(dn(w.m))}</b> (${w.n})`:t("noWin")}<button class="undo" data-share>${t("sendWin")}</button></div>
  <h3>${t("board")} · ${esc(c.name)}</h3>${M().length?board(d,c):`<p class="mut">${t("noMem")}</p>`}`;
}
function share(){
  const y=dayKey(new Date(Date.now()-864e5));
  const L=act().map(c=>{const w=ranked(y,c.id)[0];return w&&w.n>0?"• "+c.name+": "+dn(w.m)+" ("+w.n+")":"• "+c.name+": "+t("noneWin")});
  waShare("🏆 "+t("winMsg")+"\n"+L.join("\n")+"\n\n"+t("app")+" 🌙");
}
function totals(){
  const d=dayKey(),cs=act(),sum=(k,id)=>Object.keys(C).filter(x=>x.endsWith("|"+k+"|"+id)).reduce((a,x)=>a+C[x],0)+(P[k]&&id===myid?P[k]:0);
  const tbl=f=>`<div class="card tw"><table><tr><th>${t("name")}</th>${cs.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr>${M().map(m=>`<tr class="${m.id===myid?"hi":""}"><td>${esc(dn(m))}</td>${cs.map(c=>`<td>${f(c.id,m.id)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  return `<h3>${t("all")}</h3>${tbl(sum)}<h3>${t("today")}</h3>${tbl((k,id)=>cnt(d,k,id))}`;
}

const sizes=n=>n==9?[5,4,3,3,3,3,3,3,3]:Array.from({length:n},(_,i)=>Math.floor(30/n)+(i<30%n?1:0));
function assign(r,sz){const n=sz.length,s=((-r)%n+n)%n,out=Array(n);let j=1;for(let k=0;k<n;k++){const i=(s+k)%n;out[i]=[j,j+sz[i]-1];j+=sz[i]}return out}
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const isA=()=>S.admin===myid;const updS=o=>setDoc(doc(db,"settings","main"),o,{merge:true});
const updG=(id,o)=>setDoc(doc(db,"groups",id),o,{merge:true});
const gids=g=>g.members.filter(i=>M().some(m=>m.id===i));
const rdone=id=>{const c={};Object.keys(D).forEach(k=>{if(D[k]&&k.startsWith(id+"_")){const r=k.split("_")[1];c[r]=(c[r]||0)+1}});return Object.values(c).filter(v=>v>=30).length};
const meta=x=>`<div class="mut">${t("gm",x.members.length,rdone(x.id))}</div>`;
const hlines=(js,pre,own,nm,ow)=>js.filter(j=>H[pre+j]).map(j=>{const k=pre+j,h=H[k];return `<div class="mut">🤝 ${h===myid?t("helpMe",j,nm(ow(j))):t("helpLine",j,nm(h))}${own(j)&&!D[k]?` <button class="sm" data-hc="${k}">${t("helpCancel")}</button>`:""}</div>`}).join("");
const hpanel=(todo,pre,ids,nm)=>todo.length&&ids.length>1?`<div class="mut" style="margin-top:10px">${t("helpQ")}</div><div class="row"><select id="hj">${todo.map(j=>`<option value="${j}">${t("juzW")} ${j}</option>`).join("")}</select><select id="hh">${ids.filter(i=>i!==myid).map(i=>`<option value="${i}">${esc(nm(i))}</option>`).join("")}</select><button class="sm" data-hs="${pre}">${t("ask")}</button></div>`:"";
function groups(){
  const g=G[gsel];if(g&&(g.members.includes(myid)||isA()))return gview({...g,id:gsel});
  const gs=Object.entries(G).map(([id,x])=>({...x,id})),mine=gs.filter(x=>x.members.includes(myid)),oth=gs.filter(x=>!x.members.includes(myid));

}
function gview(g){
  const ids=gids(g),lead=g.leader===myid||isA(),nm=i=>{const m=M().find(x=>x.id===i);return m?dn(m):"?"},st=g.style||"all";
  let h=`<button class="sm" data-go="">${t("back")}</button> <b>${esc(g.name)}</b><div class="mut">${t("leader")}: ${esc(nm(g.leader))} · ${t("gm",ids.length,rdone(g.id))}</div>`;
  if(!g.start)h+=`<div class="card">${t("gSet")}</div>`;
  else{
    const s0=new Date(g.start+"T00:00:00"),now=new Date(ymd(new Date())+"T00:00:00"),r=Math.floor((now-s0)/(14*864e5));
    if(r<0)h+=`<div class="card">${t("firstStarts",fmt(s0))}</div>`;
    else{
      const s=addDays(s0,r*14),e=addDays(s,13),pre=g.id+"_"+r+"_",days=Math.round((e-now)/864e5)+1,done=Object.keys(D).filter(k=>D[k]&&k.startsWith(pre)).length;
      h+=`<div class="card"><b>${t("round",r+1)}</b> · ${fmt(s)} – ${fmt(e)}<div class="mut">${t("left",days,done)}</div></div>`+(st==="pick"?pick(ids,pre,nm):auto(g,ids,r,pre,nm,e));
    }
  }
  return h+(lead?lpanel(g,ids,nm):`<button class="undo" data-lv="1">${t("leave")}</button>`);
}
function auto(g,ids,r,pre,nm,e){
  const n=ids.length;if(!n)return"";
  const sz=g.style==="assign"?ids.map(i=>(g.sz||{})[i]||0):sizes(n),a=assign(r,sz),sum=sz.reduce((x,y)=>x+y,0),idx=((-(r+1))%n+n)%n,nx=assign(r+1,sz);
  return (sum!==30?`<p class="err">${t("szSum",sum)}</p>`:"")+ids.map((i,k)=>{
    const own=i===myid,js=Array.from({length:Math.max(0,a[k][1]-a[k][0]+1)},(_,q)=>a[k][0]+q).filter(j=>j<=30),
    chips=js.map(j=>{const key=pre+j,can=own||H[key]===myid;return `<button class="chip${D[key]?" on":""}${H[key]?" help":""}" data-j="${key}"${can?"":" disabled"}>${j}</button>`}).join(""),todo=js.filter(j=>!D[pre+j]);
    return `<div class="card${own?" hi":""}"><b>${esc(nm(i))}</b> <span class="mut">${t("juzW")} ${js.length?js[0]+(js.length>1?" – "+js[js.length-1]:""):"—"}</span><div class="chips">${chips}</div>${hlines(js,pre,()=>own,nm,()=>i)}${own?hpanel(todo,pre,ids,nm):""}</div>`}).join("")
  +`<p class="mut">${t("next",fmt(addDays(e,1)),esc(nm(ids[idx])),nx[idx][1])}</p>`;
}
function pick(ids,pre,nm){
  const js=Array.from({length:30},(_,k)=>k+1),mine=js.filter(j=>O[pre+j]===myid),todo=mine.filter(j=>!D[pre+j]);
  const chips=js.map(j=>{const k=pre+j,o=O[k];if(!o)return `<button class="chip" style="border-style:dashed;border-color:var(--tq)" data-cl="${k}">${j}</button>`;const can=o===myid||H[k]===myid;return `<button class="chip${D[k]?" on":""}${H[k]?" help":""}" style="${o===myid?"outline:2px solid var(--tq)":""}" data-j="${k}"${can?"":" disabled"}>${j}</button>`}).join("");
  const leg=ids.map(i=>{const l=js.filter(j=>O[pre+j]===i);return l.length?`<div class="mut"><b>${esc(nm(i))}</b>: ${l.join(", ")}</div>`:""}).join("");

function lpanel(g,ids,nm){
  const st=g.style||"all",pend=(g.pending||[]).filter(i=>M().some(m=>m.id===i));

  +(pend.length?`<h3>${t("reqs")}</h3>`+pend.map(i=>`<div class="card row" style="justify-content:space-between"><span>${esc(nm(i))}</span><span><button class="sm" data-ok="${i}">${t("ok")}</button><button class="sm" data-no="${i}">${t("no")}</button></span></div>`).join(""):"")
  +addBox+`<h3>${t("gmem")}</h3>`+(st==="assign"?`<p class="mut">${t("szH")}</p>`:"")+ids.map((i,k)=>`<div class="card row" style="justify-content:space-between"><span>${k+1}. ${esc(nm(i))}</span><span>${st==="assign"?`<input type="number" min="0" max="30" data-sz="${i}" value="${(g.sz||{})[i]||0}" style="width:60px;margin:0">`:""}<button class="sm" data-gu="${k}">▲</button><button class="sm" data-gd="${k}">▼</button>${i!==myid&&i!==g.leader?`<button class="sm" data-gx="${i}">✕</button>`:""}</span></div>`).join("");
}

  const m0=me(),adm=S.admin,canM=!adm||adm===myid;
  const prof=`<h3>${t("prof")}</h3><div class="card"><div class="mut">${t("nameHint")}</div><input id="pn" value="${esc(m0.name)}" placeholder="${t("name")}"><div class="mut">${t("nickLbl")}</div><input id="pk" value="${esc(m0.nick||"")}" placeholder="${t("nickPh")}">${m0.anick?`<div class="mut">${t("gaveNick",esc(m0.anick))}</div>`:`<div class="mut">${t("nickNote")}</div>`}<button class="go" data-prof>${t("save")}</button></div>`;

const DU=["2:201","2:286","3:8","3:16","3:147","7:23","14:40","17:24","20:25","20:114","21:87","23:118","25:74","59:10"];
let R={day:"",h:null,d:null};
async function jget(us){for(const u of us){try{const x=await fetch(u);if(x.ok)return await x.json()}catch(e){}}return null}
function loadRem(){
  const day=dayKey();if(R.day===day)return;R={day,h:"load",d:"load"};
  const k=Math.floor(Date.UTC(...day.split("-").map((v,i)=>i==1?+v-1:+v))/864e5),n=k%42+1,ref=DU[k%DU.length];
  const B="https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/",one=j=>j&&(j.hadiths?.[0]||j.hadith?.[0]||j);
  const g=e=>jget([B+e+"/"+n+".min.json",B+e+"/"+n+".json","https://raw.githubusercontent.com/fawazahmed0/hadith-api/1/editions/"+e+"/"+n+".min.json"]).then(one);
  Promise.all([g("eng-nawawi"),g("ara-nawawi"),g("swa-nawawi")]).then(([en,ar,sw])=>{R.h=en&&en.text?{en:en.text,ar:(ar&&ar.text)||"",sw:(sw&&sw.text)||"",src:"Arba‘een an-Nawawi, Hadith "+(en.hadithnumber||n)+(en.grades&&en.grades[0]?" · "+en.grades[0].grade:"")}:"err";draw()});
  Promise.all([jget(["https://api.alquran.cloud/v1/ayah/"+ref+"/editions/quran-uthmani,en.sahih"]),jget(["https://api.alquran.cloud/v1/ayah/"+ref+"/sw.barwani"])]).then(([j,w])=>{const a=j&&j.data;R.d=a&&a[1]&&a[1].text?{ar:a[0].text,en:a[1].text,sw:(w&&w.data&&w.data.text)||"",src:"Qur’an "+a[1].surah.number+":"+a[1].numberInSurah+" ("+a[1].surah.englishName+"), Sahih International"+(w&&w.data&&w.data.text?" · Kiswahili: Al-Barwani":"")}:"err";draw()});
}
function rem(){
  loadRem();
  const card=(h,o,k)=>`<h3>${h}</h3><div class="card">${o==="load"?`<p class="mut">${t("loading")}</p>`:!o||o==="err"?`<p class="mut">${t("loadFail")}</p><button class="undo" data-rt>${t("retry")}</button>`:`<div class="ar2">${esc(o.ar)}</div><div class="mut">Kiswahili</div>${o.sw?`<div class="clamp">${esc(o.sw)}</div>`:`<p class="mut">${t("swNA")}</p>`}<div class="mut">English</div><div class="clamp">${esc(o.en)}</div><div class="mut">${esc(o.src)}</div><button class="undo" data-sh="${k}">${t("send")}</button>`}</div>`;

$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-t],[data-u],[data-tab],[data-join],[data-up],[data-dn],[data-del],[data-out],[data-j],[data-share],[data-prof],[data-claim],[data-nk],[data-sh],[data-rt],[data-lang],[data-cr],[data-ch],[data-ca],[data-add],[data-addc],[data-hs],[data-hc],[data-go],[data-gc],[data-rq],[data-cl],[data-rel],[data-ok],[data-no],[data-gu],[data-gd],[data-gx],[data-lv],[data-gq],[data-gqa],[data-gqn],[data-ad]");if(!b)return;
  const d=b.dataset;
  if(d.t){P[d.t]=(P[d.t]||0)+1;render();clearTimeout(timer[d.t]);timer[d.t]=setTimeout(()=>flush(d.t),700)}

  else if(d.gqa!==undefined){updS({greq:arrayRemove(d.gqa),gok:arrayUnion(d.gqa)})}
  else if(d.gqn!==undefined){updS({greq:arrayRemove(d.gqn)})}

  else if(d.rq!==undefined){updG(d.rq,{pending:arrayUnion(myid)})}

  else if(d.rel!==undefined){setDoc(doc(db,"juz",d.rel),{owner:"",helper:""},{merge:true})}
  else if(d.ok!==undefined){if(G[gsel].members.length<30)updG(gsel,{pending:arrayRemove(d.ok),members:arrayUnion(d.ok)})}

  else if(d.gu!==undefined||d.gd!==undefined){const a=gids(G[gsel]),i=+(d.gu??d.gd);if(d.gu!==undefined&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];else if(d.gd!==undefined&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];updG(gsel,{members:a})}
  else if(d.gx!==undefined){if(confirm(t("rm",dn(M().find(m=>m.id===d.gx)))))updG(gsel,{members:arrayRemove(d.gx)})}
  else if(d.lv!==undefined){if(confirm(t("leave")+"?")){updG(gsel,{members:arrayRemove(myid)});gsel="";render()}}

  else if(d.prof!==undefined){const n=document.getElementById("pn").value.trim(),k=document.getElementById("pk").value.trim();if(!n)return;S.members=M().map(m=>m.id===myid?{...m,name:n,nick:k}:m);save();render()}

    else if(d.del!==undefined){if(!confirm(t("rm",dn(a[i]))))return;a.splice(i,1)}
    S.members=a;save();render();
  }
});
$app.addEventListener("change",e=>{
  if(e.target.id==="st"){S.start=e.target.value;save()}

});
